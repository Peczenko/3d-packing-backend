name: CD

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to build and deploy, e.g. v0.0.5
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to rebuild and redeploy, e.g. v0.0.5
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  image-api:
    name: Build & push API image (GHCR)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Derive image name and version from the tag
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 (runs Gradle; the JDK 25 toolchain is auto-provisioned)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the application jar
        run: ./gradlew :app:bootJar --no-daemon

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=image-api
          cache-to: type=gha,mode=max,scope=image-api

  image-worker:
    name: Build & push worker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Derive image name and version from the tag
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/worker" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=image-worker
          cache-to: type=gha,mode=max,scope=image-worker

  deploy:
    name: Point the deploy repo at the release
    needs: [image-api, image-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Peczenko/3d-packing-deployment
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}

      - name: Bump the GCP overlay image tags
        env:
          VERSION: ${{ needs.image-api.outputs.version }}
          FILE: overlays/gcp/kustomization.yaml
        run: |
          images='.name == "packing-backend" or .name == "packing-worker"'
          yq -i "(.images[] | select($images)).newTag = strenv(VERSION)" "$FILE"
          test "$(yq "[.images[] | select(($images) and .newTag == strenv(VERSION))] | length" "$FILE")" = 2

      - name: Commit and push
        env:
          VERSION: ${{ needs.image-api.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "Already on $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: backend $VERSION"
          git push || { git pull --rebase && git push; }
