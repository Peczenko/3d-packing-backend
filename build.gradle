plugins {
    id 'base'

    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.jooq.docker) apply false
    alias(libs.plugins.spotless) apply false
}

group = 'com.packing'
version = '1.0.0' // x-release-please-version
description = '3d-packing-backend'

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'checkstyle'

    group = rootProject.group
    version = rootProject.version

    spotless {
        java {
            target 'src/*/java/**/*.java'
            eclipse().configFile rootProject.file('config/formatter/eclipse-format.xml')
        }
    }

    checkstyle {
        toolVersion = libs.versions.checkstyle.get()
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
    }

    afterEvaluate { proj ->
        proj.tasks.withType(Checkstyle).configureEach { task ->
            String sourceSetName = task.name.substring('checkstyle'.length()).uncapitalize()
            task.classpath = proj.files()
            task.setDependsOn([])
            task.source = proj.fileTree("src/${sourceSetName}/java") {
                include '**/*.java'
            }
            task.reports {
                xml.required = false
                html.required = true
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencies {
        ['api', 'implementation', 'compileOnly', 'annotationProcessor', 'runtimeOnly',
         'testImplementation', 'testCompileOnly', 'testAnnotationProcessor', 'testRuntimeOnly'
        ].each { conf ->
            add(conf, platform(libs.spring.boot.bom))
            add(conf, platform(libs.spring.cloud.azure.bom))
        }

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    plugins.withId('java-test-fixtures') {
        dependencies {
            testFixturesApi platform(libs.spring.boot.bom)
            testFixturesApi platform(libs.spring.cloud.azure.bom)
            testFixturesAnnotationProcessor platform(libs.spring.boot.bom)
            testFixturesCompileOnly 'org.projectlombok:lombok'
            testFixturesAnnotationProcessor 'org.projectlombok:lombok'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    tasks.named('test') {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat = 'full'
        }
    }
}

tasks.register('lint') {
    group = 'verification'
    description = 'Runs Spotless and Checkstyle across every module.'
    dependsOn subprojects.collect { subproject ->
        subproject.tasks.matching { it.name == 'spotlessCheck' || it instanceof Checkstyle }
    }
}
