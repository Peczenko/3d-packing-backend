[versions]
springBoot = "3.5.16"
springCloudAzure = "6.1.0"
netty = "4.2.15.Final"
jooq = "3.19.35"
jooqDocker = "8.0.30"
postgres = "42.7.11"
firebaseAdmin = "9.10.0"
springdoc = "2.9.0"
archunit = "1.4.1"
spotless = "8.9.0"
checkstyle = "13.10.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-cloud-azure-bom = { module = "com.azure.spring:spring-cloud-azure-dependencies", version.ref = "springCloudAzure" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }

jooq-codegen = { module = "org.jooq:jooq-codegen", version.ref = "jooq" }
postgres-driver = { module = "org.postgresql:postgresql", version.ref = "postgres" }

firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebaseAdmin" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
jooq-docker = { id = "dev.monosoul.jooq-docker", version.ref = "jooqDocker" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
