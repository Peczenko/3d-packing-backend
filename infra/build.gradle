import org.jooq.meta.jaxb.ForcedType
import org.jooq.meta.jaxb.LambdaConverter

plugins {
    id 'dev.monosoul.jooq-docker'
    id 'java-test-fixtures'
}

description = 'Driven adapters: jOOQ persistence, Flyway migrations, Firebase and Azure clients.'

dependencies {
    implementation project(':core')
    implementation project(':domain')

    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework:spring-web'
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    implementation 'org.thymeleaf:thymeleaf'

    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    implementation 'org.postgresql:postgresql'

    implementation 'com.azure.spring:spring-cloud-azure-starter-keyvault'
    implementation 'com.azure.spring:spring-cloud-azure-starter-storage'

    implementation 'com.azure:azure-storage-blob'

    implementation libs.firebase.admin

    jooqCodegen libs.jooq.codegen
    jooqCodegen libs.postgres.driver

    testFixturesApi 'org.springframework.boot:spring-boot-test'
    testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesApi 'org.testcontainers:postgresql'
    testFixturesApi 'org.testcontainers:junit-jupiter'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    testImplementation 'org.testcontainers:azure'
    testImplementation 'org.postgresql:postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
}


jooq {
    withContainer {
        image {
            name = 'postgres:16-alpine'
        }
    }
}

tasks.named('generateJooqClasses') {
    basePackageName = 'com.packing.backend.infra.persistence.jooq'

    schemas = ['public']
    outputSchemaToDefault.add('public')

    setFromFilesystem(migrationLocations, 'src/main/resources/db/migration')

    outputDirectory = layout.buildDirectory.dir('generated-src/jooq')

    usingJavaConfig {
        generate.withJavaTimeTypes(true)
                .withPojos(false)
                .withDaos(false)
                .withFluentSetters(false)

        database.withForcedTypes(
                new ForcedType()
                        .withUserType('com.packing.backend.domain.user.UserRole')
                        .withLambdaConverter(new LambdaConverter()
                                .withFrom('com.packing.backend.domain.user.UserRole::valueOf')
                                .withTo('com.packing.backend.domain.user.UserRole::name'))
                        .withIncludeExpression('users\\.role'),
                new ForcedType()
                        .withUserType('com.packing.backend.domain.user.UserStatus')
                        .withLambdaConverter(new LambdaConverter()
                                .withFrom('com.packing.backend.domain.user.UserStatus::valueOf')
                                .withTo('com.packing.backend.domain.user.UserStatus::name'))
                        .withIncludeExpression('users\\.status'),
                new ForcedType()
                        .withUserType('com.packing.backend.domain.project.ProjectStatus')
                        .withLambdaConverter(new LambdaConverter()
                                .withFrom('com.packing.backend.domain.project.ProjectStatus::valueOf')
                                .withTo('com.packing.backend.domain.project.ProjectStatus::name'))
                        .withIncludeExpression('projects\\.status'),
                new ForcedType()
                        .withUserType('com.packing.backend.domain.project.ProjectPermission')
                        .withLambdaConverter(new LambdaConverter()
                                .withFrom('com.packing.backend.domain.project.ProjectPermission::valueOf')
                                .withTo('com.packing.backend.domain.project.ProjectPermission::name'))
                        .withIncludeExpression('project_members\\.permission'),
                new ForcedType()
                        .withUserType('com.packing.backend.domain.file.FileStatus')
                        .withLambdaConverter(new LambdaConverter()
                                .withFrom('com.packing.backend.domain.file.FileStatus::valueOf')
                                .withTo('com.packing.backend.domain.file.FileStatus::name'))
                        .withIncludeExpression('files\\.status'),
                new ForcedType()
                        .withUserType('com.packing.backend.domain.file.ModelFormat')
                        .withLambdaConverter(new LambdaConverter()
                                .withFrom('com.packing.backend.domain.file.ModelFormat::valueOf')
                                .withTo('com.packing.backend.domain.file.ModelFormat::name'))
                        .withIncludeExpression('files\\.format'),
                new ForcedType()
                        .withUserType('com.packing.backend.domain.packing.PackingJobStatus')
                        .withLambdaConverter(new LambdaConverter()
                                .withFrom('com.packing.backend.domain.packing.PackingJobStatus::valueOf')
                                .withTo('com.packing.backend.domain.packing.PackingJobStatus::name'))
                        .withIncludeExpression('packing_jobs\\.status'),
                new ForcedType()
                        .withUserType('com.packing.backend.domain.user.UserId')
                        .withLambdaConverter(new LambdaConverter()
                                .withFrom('com.packing.backend.domain.user.UserId::new')
                                .withTo('com.packing.backend.domain.user.UserId::value'))
                        .withIncludeExpression('users\\.id' +
                                '|project_members\\.user_id' +
                                '|project_members\\.added_by' +
                                '|projects\\.created_by' +
                                '|files\\.owner_user_id' +
                                '|packing_jobs\\.created_by'),
                new ForcedType()
                        .withUserType('com.packing.backend.domain.project.ProjectId')
                        .withLambdaConverter(new LambdaConverter()
                                .withFrom('com.packing.backend.domain.project.ProjectId::new')
                                .withTo('com.packing.backend.domain.project.ProjectId::value'))
                        .withIncludeExpression('projects\\.id' +
                                '|project_members\\.project_id' +
                                '|files\\.project_id' +
                                '|packing_jobs\\.project_id'),
                new ForcedType()
                        .withUserType('com.packing.backend.domain.file.FileId')
                        .withLambdaConverter(new LambdaConverter()
                                .withFrom('com.packing.backend.domain.file.FileId::new')
                                .withTo('com.packing.backend.domain.file.FileId::value'))
                        .withIncludeExpression('files\\.id'),
                new ForcedType()
                        .withUserType('com.packing.backend.domain.packing.PackingJobId')
                        .withLambdaConverter(new LambdaConverter()
                                .withFrom('com.packing.backend.domain.packing.PackingJobId::new')
                                .withTo('com.packing.backend.domain.packing.PackingJobId::value'))
                        .withIncludeExpression('packing_jobs\\.id'),
                new ForcedType()
                        .withUserType('java.time.Instant')
                        .withLambdaConverter(new LambdaConverter()
                                .withFrom('java.time.OffsetDateTime::toInstant')
                                .withTo('i -> i.atOffset(java.time.ZoneOffset.UTC)'))
                        .withIncludeTypes('TIMESTAMP\\ WITH\\ TIME\\ ZONE')
        )
    }
}
