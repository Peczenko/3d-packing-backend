<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{layout :: page(~{::#content})}">
<body>
<div id="content">
    <h1 th:text="${headline}">Packing job succeeded</h1>
    <p class="subheading" th:text="${projectName}">Chassis packing</p>

    <table class="fields">
        <tr th:each="field : ${fields}">
            <td class="label" th:text="${field.key}">Status</td>
            <td class="value" th:text="${field.value}">Succeeded</td>
        </tr>
    </table>

    <p th:text="${summary}">Your packed result is ready to download.</p>
</div>
</body>
</html>
