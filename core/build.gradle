description = 'Application layer: application services, commands/results, output ports.'

dependencies {
    // `api`, not `implementation`: the port signatures in this module expose domain
    // types, so :api and :infra need them on their COMPILE classpath transitively.
    api project(':domain')

    api 'org.springframework:spring-tx'
    api 'org.springframework:spring-context'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
}
