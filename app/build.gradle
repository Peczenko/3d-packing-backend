plugins {
    id 'org.springframework.boot'
}

description = 'Spring Boot composition root: application class, security config, bean wiring.'

springBoot {
    buildInfo()
}

dependencies {
    implementation project(':api')
    implementation project(':infra')
    implementation project(':core')
    implementation project(':domain')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.jooq:jooq'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation testFixtures(project(':infra'))

    testImplementation libs.archunit.junit5
}

// ServiceBusEmulatorConfigTest locates config/servicebus/config.json itself by walking up from user.dir,
// but Gradle has no way to know the test reads that file unless it is declared an input: without it,
// Gradle marks this task UP-TO-DATE when only that file changed, and the regression guard stops running
// at exactly the moment it would catch something. PathSensitivity.NONE keeps the file's absolute path out
// of the cache key, since only its content matters.
tasks.named('test') {
    inputs.file(rootProject.file('config/servicebus/config.json'))
            .withPropertyName('serviceBusEmulatorConfig')
            .withPathSensitivity(PathSensitivity.NONE)
}

tasks.named('jar') {
    enabled = false
}
