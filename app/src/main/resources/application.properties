spring.application.name=3d-packing-backend

spring.http.client.factory=http-components
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.locations=classpath:db/migration

spring.jooq.sql-dialect=POSTGRES

management.endpoints.web.exposure.include=health,info

app.cors.allowed-origins=http://localhost:3000

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:105MB}
spring.servlet.multipart.file-size-threshold=1MB

app.storage.container-name=${STORAGE_CONTAINER_NAME:models}
app.storage.download-url-ttl=${STORAGE_DOWNLOAD_URL_TTL:5m}

packing.messaging.enabled=${PACKING_MESSAGING_ENABLED:false}
packing.messaging.dispatch-queue=${PACKING_DISPATCH_QUEUE:packing-dispatch}
packing.messaging.result-queue=${PACKING_RESULT_QUEUE:packing-results}
packing.messaging.reconcile-delay=PT30S
packing.messaging.result-concurrent-sessions=5

app.email.enabled=${EMAIL_ENABLED:false}
app.email.from-address=${EMAIL_FROM_ADDRESS:noreply@3dpacking.dev}
app.email.from-name=${EMAIL_FROM_NAME:3D Packing}
app.email.brevo.api-key=${BREVO_API_KEY:}

app.alerts.recipients=${ALERT_RECIPIENTS:}
app.alerts.cooldown=${ALERT_COOLDOWN:15m}
app.alerts.max-per-hour=${ALERT_MAX_PER_HOUR:20}
