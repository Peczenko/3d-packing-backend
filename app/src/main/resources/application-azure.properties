spring.cloud.azure.keyvault.secret.property-sources[0].name=packing-kv
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=https://packing-kv.vault.azure.net/

spring.cloud.azure.credential.managed-identity-enabled=true

packing.messaging.enabled=true
packing.messaging.fully-qualified-namespace=${SERVICE_BUS_NAMESPACE}.servicebus.windows.net

spring.datasource.url=jdbc:postgresql://${db.endpoint}:${DB_PORT:5432}/${DB_NAME:packing}?sslmode=require&logServerErrorDetail=false
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

firebase.project-id=${firebase.project.id}
firebase.service-account=${firebase.service.account}

spring.cloud.azure.storage.blob.endpoint=${storage.blob.endpoint}

app.storage.sas-mode=USER_DELEGATION

app.email.enabled=${EMAIL_ENABLED:true}
app.email.brevo.api-key=${brevo.api.key:}
app.alerts.recipients=${alerts.recipients:}
