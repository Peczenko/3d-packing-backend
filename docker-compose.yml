name: packing-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: packing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-packing}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-packing}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.31.0
    container_name: packing-azurite
    restart: unless-stopped
    command: "azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 5s
      retries: 12

  temporal:
    profiles: ["packing"]
    image: temporalio/temporal:1.9.1
    container_name: packing-temporal
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "packing"]
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
      - "${TEMPORAL_UI_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "--namespace", "packing", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  app:
    profiles: ["app", "packing"]
    build:
      context: .
    image: packing-backend:local
    container_name: packing-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
      temporal:
        condition: service_healthy
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-packing}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-packing}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-packing-local}
      FIREBASE_SERVICE_ACCOUNT_B64: ${FIREBASE_SERVICE_ACCOUNT_B64:-}
      FIREBASE_ADMIN_ENABLED: ${FIREBASE_ADMIN_ENABLED:-false}
      AZURITE_HOST: azurite
      AZURITE_BLOB_PORT: 10000
      SPRING_CLOUD_AZURE_STORAGE_BLOB_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      STORAGE_CONTAINER_NAME: ${STORAGE_CONTAINER_NAME:-models}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      APP_EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: packing
    ports:
      - "${APP_PORT:-8080}:8080"

  packing-worker:
    profiles: ["packing"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: packing-worker:local
    container_name: packing-worker
    restart: unless-stopped
    depends_on:
      azurite:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: packing
      STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      STORAGE_CONTAINER_NAME: ${STORAGE_CONTAINER_NAME:-models}
      PACKER_PATH: /usr/local/bin/packer
      PACKING_WORK_ROOT: /tmp

  storage-ui:
    profiles: ["tools"]
    image: rclone/rclone:latest
    container_name: packing-storage-ui
    restart: unless-stopped
    depends_on:
      azurite:
        condition: service_healthy
    environment:
      RCLONE_CONFIG_AZURITE_TYPE: azureblob
      RCLONE_CONFIG_AZURITE_ACCOUNT: devstoreaccount1
      RCLONE_CONFIG_AZURITE_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      RCLONE_CONFIG_AZURITE_ENDPOINT: http://azurite:10000/devstoreaccount1
    entrypoint:
      - rclone
      - rcd
      - --rc-web-gui
      - --rc-web-gui-no-open-browser
      - --rc-addr=:5572
      - --rc-user=${STORAGE_UI_USER:-admin}
      - --rc-pass=${STORAGE_UI_PASSWORD:-admin}
    volumes:
      - rclone-cache:/root/.cache/rclone
    ports:
      - "${STORAGE_UI_PORT:-5572}:5572"

volumes:
  postgres-data:
  azurite-data:
  rclone-cache:
