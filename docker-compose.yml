name: packing-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: packing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-packing}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-packing}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.31.0
    container_name: packing-azurite
    restart: unless-stopped
    command: "azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 5s
      retries: 12

  servicebus-sql:
    profiles: ["messaging", "packing"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: packing-servicebus-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SERVICE_BUS_SQL_PASSWORD:-PackingServiceBus1!}
    volumes:
      - servicebus-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  servicebus:
    profiles: ["messaging", "packing"]
    image: packing-servicebus-emulator:local
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/aspnet:8.0.3-cbl-mariner2.0-amd64 AS health-tools
        FROM mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
        COPY --from=health-tools /bin/sh /bin/sh
        COPY --from=health-tools /usr/bin/curl /usr/bin/curl
        COPY --from=health-tools /usr/lib /usr/lib
    container_name: packing-servicebus
    restart: unless-stopped
    depends_on:
      servicebus-sql:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: ${SERVICE_BUS_SQL_PASSWORD:-PackingServiceBus1!}
      EMULATOR_HTTP_PORT: 5300
      SQL_WAIT_INTERVAL: 5
    volumes:
      - ./config/servicebus/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
      - servicebus-logs:/home/app/EmulatorLogs
    ports:
      - "${SERVICE_BUS_AMQP_PORT:-5672}:5672"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5300/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  app:
    profiles: ["app"]
    build:
      context: .
    image: packing-backend:local
    container_name: packing-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-packing}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-packing}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-packing-local}
      FIREBASE_SERVICE_ACCOUNT_B64: ${FIREBASE_SERVICE_ACCOUNT_B64:-}
      FIREBASE_ADMIN_ENABLED: ${FIREBASE_ADMIN_ENABLED:-false}
      AZURITE_HOST: azurite
      AZURITE_BLOB_PORT: 10000
      SPRING_CLOUD_AZURE_STORAGE_BLOB_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      STORAGE_CONTAINER_NAME: ${STORAGE_CONTAINER_NAME:-models}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
      PACKING_MESSAGING_ENABLED: ${PACKING_MESSAGING_ENABLED:-false}
      PACKING_MESSAGING_CONNECTION_STRING: ${SERVICE_BUS_CONNECTION_STRING:-}
    ports:
      - "${APP_PORT:-8080}:8080"

  packing-worker:
    profiles: ["packing"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: packing-worker:local
    restart: "no"
    depends_on:
      azurite:
        condition: service_healthy
      servicebus:
        condition: service_healthy
    environment:
      SERVICE_BUS_CONNECTION_STRING: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      STORAGE_CONTAINER_NAME: ${STORAGE_CONTAINER_NAME:-models}
      PACKER_PATH: /usr/local/bin/packer
      PACKING_WORK_ROOT: /tmp
      PACKING_RECEIVE_TIMEOUT: ${PACKING_RECEIVE_TIMEOUT:-60s}
      PACKING_LOCK_RENEW_INTERVAL: ${PACKING_LOCK_RENEW_INTERVAL:-20s}
      PACKING_DISPATCH_QUEUE: ${PACKING_DISPATCH_QUEUE:-packing-dispatch}
      PACKING_RESULT_QUEUE: ${PACKING_RESULT_QUEUE:-packing-results}

  storage-ui:
    profiles: ["tools"]
    image: rclone/rclone:latest
    container_name: packing-storage-ui
    restart: unless-stopped
    depends_on:
      azurite:
        condition: service_healthy
    environment:
      RCLONE_CONFIG_AZURITE_TYPE: azureblob
      RCLONE_CONFIG_AZURITE_ACCOUNT: devstoreaccount1
      RCLONE_CONFIG_AZURITE_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      RCLONE_CONFIG_AZURITE_ENDPOINT: http://azurite:10000/devstoreaccount1
    entrypoint:
      - rclone
      - rcd
      - --rc-web-gui
      - --rc-web-gui-no-open-browser
      - --rc-addr=:5572
      - --rc-user=${STORAGE_UI_USER:-admin}
      - --rc-pass=${STORAGE_UI_PASSWORD:-admin}
    volumes:
      - rclone-cache:/root/.cache/rclone
    ports:
      - "${STORAGE_UI_PORT:-5572}:5572"

volumes:
  postgres-data:
  azurite-data:
  servicebus-sql-data:
  servicebus-logs:
  rclone-cache:
